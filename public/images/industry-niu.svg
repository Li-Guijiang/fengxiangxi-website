<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280">
  <rect width="480" height="280" fill="#F0F8E8"/>
  <!-- 草地 -->
  <rect x="0" y="200" width="480" height="80" fill="#8B9D5A"/>
  <rect x="0" y="210" width="480" height="70" fill="#7B8D4A"/>
  <!-- 山 -->
  <path d="M0 200 Q150 150 300 180 Q450 140 480 170 L480 280 L0 280Z" fill="#6B8D4A" opacity="0.3"/>
  <!-- 牛1 -->
  <g transform="translate(60,185)">
    <ellipse cx="30" cy="15" rx="28" ry="18" fill="#8B6914"/>
    <ellipse cx="18" cy="5" rx="14" ry="12" fill="#9B7930"/>
    <circle cx="6" cy="2" r="2" fill="#3A1A00"/>
    <!-- 角 -->
    <path d="M8 0 Q5 -8 3 -10" stroke="#4A3A2A" stroke-width="1.5" fill="none"/>
    <!-- 腿 -->
    <rect x="10" y="28" width="4" height="18" fill="#6B4914" rx="1"/>
    <rect x="22" y="28" width="4" height="18" fill="#6B4914" rx="1"/>
    <rect x="40" y="28" width="4" height="18" fill="#6B4914" rx="1"/>
    <rect x="48" y="28" width="4" height="18" fill="#6B4914" rx="1"/>
  </g>
  <!-- 牛2 -->
  <g transform="translate(300,175)">
    <ellipse cx="35" cy="20" rx="32" height="18" fill="#A08050"/>
    <ellipse cx="20" cy="8" rx="15" ry="13" fill="#B09060"/>
    <circle cx="8" cy="5" r="2" fill="#3A1A00"/>
    <path d="M10 2 Q6 -10 4 -12" stroke="#4A3A2A" stroke-width="1.5" fill="none"/>
    <rect x="14" y="35" width="5" height="20" fill="#806030" rx="1"/>
    <rect x="28" y="35" width="5" height="20" fill="#806030" rx="1"/>
    <rect x="48" y="35" width="5" height="20" fill="#806030" rx="1"/>
    <rect x="56" y="35" width="5" height="20" fill="#806030" rx="1"/>
  </g>
  <!-- 栅栏 -->
  <line x1="200" y1="200" x2="200" y2="230" stroke="#6B4A1A" stroke-width="3"/>
  <line x1="250" y1="200" x2="250" y2="230" stroke="#6B4A1A" stroke-width="3"/>
  <line x1="195" y1="210" x2="255" y2="210" stroke="#8B6914" stroke-width="2"/>
  <line x1="195" y1="222" x2="255" y2="222" stroke="#8B6914" stroke-width="2"/>
  <text x="240" y="268" text-anchor="middle" fill="#5D3A1A" font-size="11" font-weight="bold">生态肉牛养殖场</text>
</svg>
