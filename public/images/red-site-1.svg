<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#E8F4FD"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4A574"/><stop offset="100%" stop-color="#B8956E"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A3728"/><stop offset="100%" stop-color="#2C1810"/></linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <!-- 远山 -->
  <path d="M0 220 Q120 160 240 200 Q360 170 480 210 L480 300 L0 300Z" fill="#7B9E7B" opacity="0.5"/>
  <path d="M0 250 Q150 200 300 240 Q400 210 480 245 L480 300 L0 300Z" fill="#5D8A5D" opacity="0.4"/>
  <!-- 院子地面 -->
  <rect x="60" y="220" width="360" height="80" fill="#E8D5B7"/>
  <!-- 主殿 -->
  <rect x="140" y="150" width="200" height="100" fill="url(#wall)" stroke="#8D6E4C" stroke-width="1"/>
  <polygon points="120,150 240,80 360,150" fill="url(#roof)"/>
  <polygon points="130,150 240,88 350,150" fill="#3E2723"/>
  <!-- 门 -->
  <rect x="210" y="185" width="60" height="65" fill="#5D4037" rx="2"/>
  <circle cx="260" cy="218" r="2" fill="#C8A96E"/>
  <!-- 窗 -->
  <rect x="160" y="185" width="35" height="35" fill="#3E2723" rx="2"/>
  <rect x="285" y="185" width="35" height="35" fill="#3E2723" rx="2"/>
  <!-- 左厢房 -->
  <rect x="80" y="180" width="55" height="65" fill="url(#wall)" stroke="#8D6E4C" stroke-width="1"/>
  <polygon points="65,180 107,140 150,180" fill="url(#roof)"/>
  <!-- 右厢房 -->
  <rect x="345" y="180" width="55" height="65" fill="url(#wall)" stroke="#8D6E4C" stroke-width="1"/>
  <polygon points="330,180 372,140 415,180" fill="url(#roof)"/>
  <!-- 院墙 -->
  <rect x="60" y="210" width="75" height="40" fill="#DDD0C0" rx="1"/>
  <rect x="345" y="210" width="75" height="40" fill="#DDD0C0" rx="1"/>
  <!-- 牌匾 -->
  <rect x="195" y="155" width="90" height="22" fill="#8B1A1A" rx="2"/>
  <text x="240" y="170" text-anchor="middle" fill="#FFD54F" font-size="9" font-weight="bold">枫香溪会议会址</text>
  <!-- 树木 -->
  <circle cx="50" cy="195" r="20" fill="#2E7D32" opacity="0.7"/>
  <rect x="48" y="205" width="4" height="25" fill="#5D4037"/>
  <!-- 文保标志 -->
  <rect x="350" y="250" width="80" height="18" fill="#8B1A1A" rx="3" opacity="0.9"/>
  <text x="390" y="263" text-anchor="middle" fill="white" font-size="8" font-weight="bold">全国重点文保单位</text>
</svg>
