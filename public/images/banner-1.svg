<!-- 首页Banner — 枫香溪实景风格 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="500" viewBox="0 0 1920 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="60%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3728"/>
      <stop offset="100%" stop-color="#2C1810"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="redWall" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="10" fill="#8B1A1A"/>
      <rect y="10" width="20" height="10" fill="#7B1515"/>
      <rect x="20" y="10" width="20" height="10" fill="#7B1515"/>
    </pattern>
  </defs>
  <!-- 天空渐变 -->
  <rect width="1920" height="500" fill="url(#sky)"/>
  <!-- 太阳光晕 -->
  <circle cx="1400" cy="200" r="300" fill="url(#sun)"/>
  <!-- 远山 -->
  <path d="M0 350 Q200 200 400 280 Q600 180 800 260 Q1000 150 1200 250 Q1400 170 1600 240 Q1800 160 1920 280 L1920 500 L0 500Z" fill="url(#mountain2)" opacity="0.7"/>
  <!-- 近山 -->
  <path d="M0 380 Q300 280 500 340 Q700 250 900 320 Q1100 240 1300 310 Q1500 270 1700 330 Q1800 290 1920 340 L1920 500 L0 500Z" fill="url(#mountain1)" opacity="0.85"/>
  <!-- 中式建筑群剪影 -->
  <g fill="#2C1810" opacity="0.9">
    <!-- 主殿 -->
    <rect x="800" y="310" width="120" height="80" rx="2"/>
    <polygon points="780,310 860,260 940,310"/>
    <polygon points="790,310 860,268 930,310" fill="#3E2723"/>
    <!-- 左厢房 -->
    <rect x="730" y="335" width="70" height="55" rx="2"/>
    <polygon points="720,335 765,295 810,335"/>
    <!-- 右厢房 -->
    <rect x="920" y="335" width="70" height="55" rx="2"/>
    <polygon points="910,335 955,295 1000,335"/>
    <!-- 牌坊 -->
    <rect x="855" y="385" width="6" height="50"/>
    <rect x="875" y="385" width="6" height="50"/>
    <rect x="850" y="385" width="36" height="6"/>
    <!-- 纪念碑 -->
    <rect x="960" y="300" width="8" height="90"/>
    <rect x="955" y="295" width="18" height="10"/>
    <polygon points="960,260 955,265 965,265"/>
  </g>
  <!-- 树木 -->
  <g fill="#2C1810" opacity="0.6">
    <circle cx="300" cy="350" r="35"/>
    <circle cx="350" cy="340" r="28"/>
    <circle cx="1600" cy="345" r="32"/>
    <circle cx="1650" cy="338" r="25"/>
    <circle cx="200" cy="360" r="22"/>
    <circle cx="1700" cy="355" r="20"/>
  </g>
  <!-- 飘带/旗帜 -->
  <g fill="#C41E3A" opacity="0.8">
    <polygon points="920,265 900,280 920,295 940,280"/>
    <text x="912" y="283" fill="#FFD54F" font-size="10" text-anchor="middle" font-weight="bold">★</text>
  </g>
  <!-- 前景云雾 -->
  <ellipse cx="500" cy="440" rx="400" ry="30" fill="white" opacity="0.06"/>
  <ellipse cx="1400" cy="460" rx="500" ry="25" fill="white" opacity="0.04"/>
</svg>
