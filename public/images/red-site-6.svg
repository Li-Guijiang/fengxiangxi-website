<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E0D5C0"/><stop offset="100%" stop-color="#C8B898"/></linearGradient></defs>
  <rect width="480" height="300" fill="#F5F0EB"/>
  <rect x="0" y="230" width="480" height="70" fill="#C8B898"/>
  <!-- 四合院 -->
  <rect x="80" y="120" width="320" height="130" fill="#D4C4A8" opacity="0.3"/>
  <!-- 主屋 -->
  <rect x="160" y="110" width="160" height="140" fill="url(#c)" stroke="#B8A888" stroke-width="1"/>
  <polygon points="140,110 240,50 340,110" fill="#4A3728"/>
  <polygon points="150,110 240,58 330,110" fill="#3E2723"/>
  <!-- 左屋 -->
  <rect x="80" y="150" width="70" height="70" fill="url(#c)" stroke="#B8A888" stroke-width="0.5"/>
  <polygon points="70,150 115,115 160,150" fill="#4A3728"/>
  <!-- 右屋 -->
  <rect x="330" y="150" width="70" height="70" fill="url(#c)" stroke="#B8A888" stroke-width="0.5"/>
  <polygon points="320,150 365,115 410,150" fill="#4A3728"/>
  <!-- 门 -->
  <rect x="216" y="185" width="48" height="65" fill="#5D4037" rx="2"/>
  <!-- 牌 -->
  <rect x="180" y="118" width="120" height="16" fill="#8B1A1A" rx="2"/>
  <text x="240" y="130" text-anchor="middle" fill="#FFD54F" font-size="7" font-weight="bold">红三军参谋处旧址</text>
  <!-- 树 -->
  <circle cx="50" cy="205" r="18" fill="#3E6B3E" opacity="0.5"/>
  <rect x="48" y="215" width="4" height="25" fill="#5D4037"/>
</svg>
