<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280">
  <defs><linearGradient id="pe" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#F0F0E0"/></linearGradient></defs>
  <rect width="480" height="280" fill="url(#pe)"/>
  <rect x="0" y="220" width="480" height="60" fill="#8B9D5A"/>
  <!-- 山 -->
  <path d="M0 220 Q150 170 300 200 Q420 160 480 190 L480 280 L0 280Z" fill="#7B9E7B" opacity="0.35"/>
  <!-- 桃树 -->
  <g>
    <!-- 树干 -->
    <rect x="137" y="180" width="8" height="50" fill="#8B6914" rx="2"/>
    <!-- 树冠 -->
    <circle cx="140" cy="155" r="40" fill="#5D8A3C" opacity="0.8"/>
    <circle cx="160" cy="140" r="30" fill="#6B9E4A" opacity="0.6"/>
    <circle cx="120" cy="148" r="25" fill="#4A7A3A" opacity="0.5"/>
    <!-- 桃子 -->
    <circle cx="130" cy="140" r="10" fill="#FF8A80"/>
    <circle cx="135" cy="138" r="3" fill="#FFCC80"/>
    <circle cx="155" cy="148" r="10" fill="#FF8A65"/>
    <circle cx="160" cy="146" r="3" fill="#FFCC80"/>
    <circle cx="145" cy="130" r="9" fill="#FF7043"/>
  </g>
  <!-- 另一棵树 -->
  <rect x="337" y="180" width="8" height="50" fill="#8B6914" rx="2"/>
  <circle cx="340" cy="150" r="35" fill="#5D8A3C" opacity="0.8"/>
  <circle cx="330" cy="140" r="10" fill="#FF8A80"/>
  <circle cx="350" cy="148" r="10" fill="#FF7043"/>
  <!-- 太阳 -->
  <circle cx="400" cy="60" r="30" fill="#FFD54F" opacity="0.3"/>
  <text x="240" y="260" text-anchor="middle" fill="#5D3A1A" font-size="11" font-weight="bold">苹果桃种植园</text>
</svg>
