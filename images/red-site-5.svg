  <rect x="150" y="135" width="80" height="35" fill="#F5F0EB" rx="2"/>
  <text x="190" y="150" text-anchor="middle" fill="#C41E3A" font-size="6" font-weight="bold">打土豪</text>
  <text x="190" y="162" text-anchor="middle" fill="#C41E3A" font-size="6" font-weight="bold">分田地</text>
  <!-- 窗 -->
  <rect x="330" y="155" width="25" height="25" fill="#3E2723" rx="1"/>
  <!-- 牌 -->
  <rect x="175" y="128" width="130" height="16" fill="#8B1A1A" rx="2"/>
  <text x="240" y="140" text-anchor="middle" fill="#FFD54F" font-size="7" font-weight="bold">红三军政治部旧址</text>
  <!-- 树 -->
  <circle cx="400" cy="200" r="18" fill="#2E7D32" opacity="0.5"/>
  <rect x="398" y="210" width="4" height="25" fill="#5D4037"/>
</svg>
