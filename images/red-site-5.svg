<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8D5B7"/><stop offset="100%" stop-color="#D4C4A8"/></linearGradient></defs>
  <rect width="480" height="300" fill="#F5F0EB"/>
  <rect x="0" y="220" width="480" height="80" fill="#D4C4A8"/>
  <!-- 土家木屋 -->
  <rect x="140" y="120" width="200" height="120" fill="url(#w)" stroke="#B8A888" stroke-width="1"/>
  <polygon points="120,120 240,60 360,120" fill="#4A3728"/>
  <polygon points="130,120 240,68 350,120" fill="#3E2723"/>
  <!-- 门 -->
  <rect x="210" y="180" width="60" height="60" fill="#5D4037" rx="2"/>
